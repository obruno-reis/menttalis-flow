# Netlify build for Menttalis Flow — a static Vite site, no server side.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pinned so a change to Netlify's default build image cannot break the build.
  # Vite 8 requires Node 20.19+ / 22.12+.
  NODE_VERSION = "22"

# Header rules are matched against the path as *requested*, before any rewrite
# is applied — so each file needs a rule for both forms it can be asked for:
# with the /flow prefix (what the browser requests, since the build carries that
# base) and without it (what arrives when menttalis.com proxies and strips it).
# Measured on a deploy preview: with only the unprefixed rule, /flow/assets/*
# silently fell back to must-revalidate and never got cached.

# The service worker must never be served from cache: a stale one keeps
# controlling the page and visitors would never receive a new build.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/flow/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Vite fingerprints everything under /assets, so those files are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/flow/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The build carries a /flow/ base, because on menttalis.com the app lives at
# that path. Netlify, however, serves dist/ at this site's root — so every asset
# the HTML asks for (/flow/assets/...) would 404 when this URL is opened
# directly. Mapping /flow/* back onto the root fixes that, and costs the proxy
# nothing: requests arriving from menttalis.com already have the prefix stripped
# by the rewrite there, so they never match this rule.
[[redirects]]
  from = "/flow/*"
  to = "/:splat"
  status = 200

# No SPA catch-all redirect on purpose: the app has no client-side router, so
# rewriting unknown paths to index.html would only hide real 404s.
